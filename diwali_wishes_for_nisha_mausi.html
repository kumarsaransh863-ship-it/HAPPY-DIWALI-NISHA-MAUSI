<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali, Nisha Mausi!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #05020a;
            color: #f8fafc;
            overflow-x: hidden;
            margin: 0;
            user-select: none;
        }

        .font-heading {
            font-family: 'Great Vibes', cursive;
        }

        .font-serif-title {
            font-family: 'Cinzel', serif;
        }

        /* Diya Flame Flicker Animation */
        @keyframes flicker {
            0%, 100% {
                transform: scale(1) rotate(-1deg);
                opacity: 0.95;
                filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.9)) drop-shadow(0 0 20px rgba(245, 158, 11, 0.7));
            }
            25% {
                transform: scale(1.08, 0.95) rotate(1deg);
                opacity: 1;
                filter: drop-shadow(0 0 12px rgba(251, 191, 36, 1)) drop-shadow(0 0 25px rgba(245, 158, 11, 0.8));
            }
            50% {
                transform: scale(0.95, 1.05) rotate(-2deg);
                opacity: 0.9;
                filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.8)) drop-shadow(0 0 15px rgba(245, 158, 11, 0.6));
            }
            75% {
                transform: scale(1.04, 1.02) rotate(2deg);
                opacity: 1;
                filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.95)) drop-shadow(0 0 22px rgba(245, 158, 11, 0.75));
            }
        }

        .flame {
            animation: flicker 1.8s infinite ease-in-out;
            transform-origin: bottom center;
        }

        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Gentle Glow Pulse */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.03); }
        }

        .glow-pulse {
            animation: pulseGlow 5s ease-in-out infinite;
        }

        /* Canvas overlay */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: auto; /* Allow direct clicking */
        }

        /* Glassmorphism card */
        .glass-card {
            background: rgba(15, 8, 28, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                        0 0 30px rgba(245, 158, 11, 0.15),
                        inset 0 0 15px rgba(245, 158, 11, 0.05);
        }

        /* Mandala Spinning Animation */
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spin-slow {
            animation: spinSlow 60s linear infinite;
        }
    </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between items-center bg-gradient-to-b from-[#070212] via-[#120826] to-[#05020a] text-amber-100 overflow-x-hidden">

    <!-- Interactive Fireworks Canvas Background -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- Subtle Background Glows -->
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-amber-500/10 rounded-full blur-[120px] pointer-events-none glow-pulse"></div>
    <div class="fixed bottom-10 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-rose-600/10 rounded-full blur-[140px] pointer-events-none"></div>

    <!-- Background Decorative Mandala -->
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[550px] md:w-[700px] h-[550px] md:h-[700px] opacity-[0.06] pointer-events-none spin-slow z-0">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="w-full h-full fill-amber-300">
            <path d="M100 0 C105 20, 115 20, 120 0 C125 20, 135 20, 140 0 C130 30, 140 40, 160 30 C145 45, 155 55, 170 50 C150 65, 160 75, 180 80 C155 90, 165 100, 190 100 C165 100, 155 110, 180 120 C160 125, 150 135, 170 150 C155 145, 145 155, 160 170 C140 160, 130 170, 140 200 C135 180, 125 180, 120 200 C115 180, 105 180, 100 200 C95 180, 85 180, 80 200 C75 180, 65 180, 60 200 C70 170, 60 160, 40 170 C55 155, 45 145, 30 150 C50 135, 40 125, 20 120 C45 110, 35 100, 10 100 C35 100, 45 90, 20 80 C40 75, 50 65, 30 50 C45 55, 55 45, 40 30 C60 40, 70 30, 60 0 C65 20, 75 20, 80 0 C85 20, 95 20, 100 0 Z" />
            <circle cx="100" cy="100" r="60" fill="none" stroke="currentColor" stroke-width="1.5" />
            <circle cx="100" cy="100" r="40" fill="none" stroke="currentColor" stroke-width="1" />
        </svg>
    </div>

    <!-- Top Navigation / Controls Bar -->
    <header class="relative z-20 w-full max-w-4xl px-6 pt-6 flex justify-between items-center">
        <!-- Logo / Tag -->
        <div class="flex items-center space-x-2 text-amber-400/90 text-sm tracking-wider uppercase font-semibold">
            <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
            <span>Shubh Deepavali</span>
        </div>

        <!-- Audio & Fireworks Interaction Hint Toggle -->
        <div class="flex items-center space-x-3">
            <button id="audioBtn" class="flex items-center space-x-2 px-3.5 py-1.5 rounded-full glass-card hover:bg-amber-500/10 text-amber-200 text-xs tracking-wide transition-all border border-amber-500/30">
                <i id="audioIcon" class="fas fa-music text-amber-400"></i>
                <span id="audioText">Play Music</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="relative z-20 w-full max-w-2xl px-4 py-8 my-auto flex flex-col items-center text-center">

        <!-- Outer Decorative Floral Border Wrapper -->
        <div class="w-full relative p-1 rounded-3xl bg-gradient-to-b from-amber-400/40 via-amber-600/10 to-rose-500/30 shadow-2xl transition-all duration-700 hover:shadow-amber-500/10">
            
            <!-- Main Glass Wish Card -->
            <div class="w-full glass-card rounded-[22px] px-6 py-10 md:p-12 flex flex-col items-center relative overflow-hidden">
                
                <!-- Corner Toran / Traditional Ornaments -->
                <div class="absolute -top-6 -left-6 w-20 h-20 pointer-events-none opacity-60">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-amber-400 stroke-current stroke-2">
                        <circle cx="20" cy="20" r="15" />
                        <path d="M20 35 L20 80 M5 50 L35 50" stroke-linecap="round" />
                    </svg>
                </div>
                <div class="absolute -top-6 -right-6 w-20 h-20 pointer-events-none opacity-60 transform scale-x-[-1]">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-amber-400 stroke-current stroke-2">
                        <circle cx="20" cy="20" r="15" />
                        <path d="M20 35 L20 80 M5 50 L35 50" stroke-linecap="round" />
                    </svg>
                </div>

                <!-- Central Top Diya Illustration -->
                <div class="relative mb-6 animate-float">
                    <div class="relative w-16 h-16 flex justify-center items-center">
                        <!-- Flame -->
                        <div class="flame absolute -top-5 w-5 h-8 bg-gradient-to-t from-amber-500 via-yellow-400 to-white rounded-full"></div>
                        <!-- Glow behind flame -->
                        <div class="absolute -top-6 w-10 h-10 bg-amber-400/30 rounded-full blur-md"></div>
                        <!-- Diya Lamp Base (SVG) -->
                        <svg viewBox="0 0 64 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-16 h-10 drop-shadow-md">
                            <path d="M2 10 C 10 32, 54 32, 62 10 C 50 18, 14 18, 2 10 Z" fill="url(#diyaGold)" stroke="#fef08a" stroke-width="1.5"/>
                            <path d="M12 16 Q 32 36 52 16" stroke="#b45309" stroke-width="1" fill="none"/>
                            <circle cx="32" cy="22" r="3" fill="#fef08a"/>
                            <defs>
                                <linearGradient id="diyaGold" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#f59e0b"/>
                                    <stop offset="50%" stop-color="#d97706"/>
                                    <stop offset="100%" stop-color="#78350f"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                </div>

                <!-- Subtitle Tag -->
                <span class="inline-block text-amber-300/80 text-xs font-semibold tracking-[0.25em] uppercase mb-2">
                    Warmest Greetings
                </span>

                <!-- Short Heading -->
                <h1 class="font-heading text-4xl sm:text-5xl md:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-300 to-amber-400 font-bold mb-5 leading-tight drop-shadow-sm">
                    Happy Diwali, Nisha Mausi!
                </h1>

                <!-- Subtle Decorative Divider -->
                <div class="flex items-center justify-center space-x-3 w-48 mb-6 opacity-75">
                    <div class="h-[1px] flex-1 bg-gradient-to-r from-transparent to-amber-400"></div>
                    <i class="fas fa-om text-amber-400 text-xs"></i>
                    <div class="h-[1px] flex-1 bg-gradient-to-l from-transparent to-amber-400"></div>
                </div>

                <!-- Short, Warm & Respectful Wish Message -->
                <p class="text-base sm:text-lg md:text-xl text-amber-100/90 font-light leading-relaxed max-w-lg mb-8">
                    Wishing you a bright, peaceful, and joyful Diwali filled with love, laughter, and light.
                </p>

                <!-- Blessing Highlight Badge -->
                <div class="inline-flex items-center space-x-2 px-4 py-2 rounded-full bg-amber-500/10 border border-amber-400/20 text-amber-300 text-xs sm:text-sm font-medium tracking-wide">
                    <i class="fas fa-sparkles text-yellow-400"></i>
                    <span>Happy Deepavali to You & Family</span>
                </div>

                <!-- Interactive Hint -->
                <p class="mt-8 text-xs text-amber-400/50 tracking-wider">
                    <i class="fas fa-hand-pointer mr-1 animate-bounce"></i> Tap anywhere on the screen to launch fireworks
                </p>

            </div>
        </div>

    </main>

    <!-- Bottom Decorative Diya Row Footer -->
    <footer class="relative z-20 w-full max-w-3xl px-6 pb-6 flex justify-around items-center opacity-80">
        <!-- Diya Left -->
        <div class="flex flex-col items-center">
            <div class="flame w-3.5 h-6 bg-gradient-to-t from-amber-500 to-yellow-300 rounded-full mb-0.5"></div>
            <div class="w-10 h-4 bg-gradient-to-r from-amber-600 to-amber-700 rounded-b-full border-t border-amber-400"></div>
        </div>
        <!-- Center Subtle Text -->
        <div class="text-center">
            <p class="text-xs text-amber-300/60 font-serif-title tracking-widest uppercase">Shine & Prosper</p>
        </div>
        <!-- Diya Right -->
        <div class="flex flex-col items-center">
            <div class="flame w-3.5 h-6 bg-gradient-to-t from-amber-500 to-yellow-300 rounded-full mb-0.5"></div>
            <div class="w-10 h-4 bg-gradient-to-r from-amber-600 to-amber-700 rounded-b-full border-t border-amber-400"></div>
        </div>
    </footer>

    <!-- Background Audio (Ambient Indian Sitar / Flute melody sample using Web Audio API synthesized tones) -->
    <script>
        // Web Audio Synthesizer for Ambient Diwali Sound (No external asset dependency)
        class AmbientDiwaliAudio {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.timer = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playNotes() {
                if (!this.isPlaying || !this.ctx) return;
                
                // Pentatonic Raag-like notes (C, D#, F, G, A#)
                const notes = [261.63, 311.13, 349.23, 392.00, 466.16, 523.25];
                const freq = notes[Math.floor(Math.random() * notes.length)];
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                
                // Soft warm envelope
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + 0.4);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 3.0);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 3.1);
                
                const nextTime = Math.random() * 800 + 400;
                this.timer = setTimeout(() => this.playNotes(), nextTime);
            }

            toggle() {
                this.init();
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                if (this.isPlaying) {
                    this.isPlaying = false;
                    clearTimeout(this.timer);
                    return false;
                } else {
                    this.isPlaying = true;
                    this.playNotes();
                    return true;
                }
            }
        }

        const audioSynth = new AmbientDiwaliAudio();
        const audioBtn = document.getElementById('audioBtn');
        const audioIcon = document.getElementById('audioIcon');
        const audioText = document.getElementById('audioText');

        audioBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevents launching firework right on button click
            const active = audioSynth.toggle();
            if (active) {
                audioIcon.className = 'fas fa-volume-up text-amber-400 animate-pulse';
                audioText.textContent = 'Music On';
            } else {
                audioIcon.className = 'fas fa-music text-amber-400';
                audioText.textContent = 'Play Music';
            }
        });
    </script>

    <!-- Canvas Fireworks Animation Engine -->
    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Color palettes suitable for a Diwali celebration (Gold, Warm Red, Yellow, Cyan, Magenta)
        const colors = [
            '#f59e0b', '#fbbf24', '#fef08a', '#ef4444', 
            '#f43f5e', '#ec4899', '#38bdf8', '#a855f7'
        ];

        // Particle Class for Fireworks Explosion Burst
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.018 + 0.012;
                this.gravity = 0.08;
                this.friction = 0.96;
                this.size = Math.random() * 2.5 + 1;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Rocket Class (Shoots up from bottom with glowing trail)
        class Rocket {
            constructor(startX, targetX, targetY) {
                this.x = startX;
                this.y = height;
                this.targetX = targetX;
                this.targetY = targetY;
                const distance = Math.hypot(targetX - startX, targetY - height);
                this.speed = Math.random() * 3 + 8;
                this.angle = Math.atan2(targetY - height, targetX - startX);
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.trail = [];
                this.trailLength = 8;
                this.exploded = false;
            }

            update() {
                // Store trail coordinates
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                this.x += this.vx;
                this.y += this.vy;

                // Check if reached destination or started moving downwards
                if (this.vy < 0 && this.y <= this.targetY) {
                    this.exploded = true;
                    createBurst(this.x, this.y, this.color);
                }
            }

            draw() {
                // Draw sparkling trail
                for (let i = 0; i < this.trail.length; i++) {
                    const point = this.trail[i];
                    const alpha = (i + 1) / this.trail.length;
                    ctx.save();
                    ctx.globalAlpha = alpha * 0.7;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, Math.random() * 1.5 + 1, 0, Math.PI * 2);
                    ctx.fillStyle = '#fbbf24';
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = '#f59e0b';
                    ctx.fill();
                    ctx.restore();
                }

                // Draw rocket head
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        let rockets = [];
        let particles = [];

        function createBurst(x, y, color) {
            const particleCount = Math.floor(Math.random() * 40) + 60;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function launchRandomRocket() {
            const startX = Math.random() * (width * 0.8) + width * 0.1;
            const targetX = startX + (Math.random() * 100 - 50);
            const targetY = Math.random() * (height * 0.45) + height * 0.1;
            rockets.push(new Rocket(startX, targetX, targetY));
        }

        // Interactive tap/click to launch custom rockets
        window.addEventListener('pointerdown', (e) => {
            // Ignore if clicking on interactive audio button
            if (e.target.closest('#audioBtn')) return;

            const startX = Math.random() * (width * 0.4) + width * 0.3;
            rockets.push(new Rocket(startX, e.clientX, e.clientY));
        });

        // Auto launch rockets periodically
        let lastAutoLaunch = 0;

        function animate(timestamp) {
            // Dark night sky trail effect
            ctx.fillStyle = 'rgba(5, 2, 10, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Auto spawn rockets every 700ms - 1500ms
            if (timestamp - lastAutoLaunch > Math.random() * 800 + 600) {
                launchRandomRocket();
                lastAutoLaunch = timestamp;
            }

            // Update & Draw Rockets
            for (let i = rockets.length - 1; i >= 0; i--) {
                rockets[i].update();
                rockets[i].draw();
                if (rockets[i].exploded) {
                    rockets.splice(i, 1);
                }
            }

            // Update & Draw Explosion Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Launch initial burst on load
        window.onload = function() {
            setTimeout(launchRandomRocket, 300);
            setTimeout(launchRandomRocket, 700);
            requestAnimationFrame(animate);
        };
    </script>
</body>
